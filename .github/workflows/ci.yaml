name: Weather app CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
        - name: Set up Docker Compose
          uses: docker/setup-compose-action@v1
          with:
            version: 'latest'
          run: docker-compose up -d --build
